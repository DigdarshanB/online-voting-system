services:
  db:
    image: mysql:8.0
    container_name: ovs_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ovs
      MYSQL_USER: ovs_user
      MYSQL_PASSWORD: ovs_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - ovs_mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: ovs_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build:
      context: ../backend
    container_name: ovs_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql+pymysql://ovs_user:ovs_password@db:3306/ovs
      JWT_SECRET: a_very_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      SECRET_KEY: a_very_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    container_name: ovs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  frontend-admin:
    build:
      context: ../frontend-admin
    container_name: ovs_frontend_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  ovs_mysql_data: